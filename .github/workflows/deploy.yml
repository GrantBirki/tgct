name: deploy

on:
  push:
    paths-ignore:
      - "LICENSE"
      - "README.md"
      - ".gitignore"
    branches:
      - main
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

permissions: {}

jobs:
  deployment-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      pages: read
    outputs: # set outputs for use in downstream jobs
      base_url: ${{ steps.pages.outputs.base_url }}
      continue: ${{ steps.deployment-check.outputs.continue }}

    steps:
      # https://github.com/github/branch-deploy/blob/d3c24bd92505e623615b75ffdfac5ed5259adbdb/docs/merge-commit-strategy.md
      - name: deployment check
        uses: grantbirki/branch-deploy@a7a7ea40a15a79a036322c2924ab74f5eded702c # pin@v12.1.0
        id: deployment-check
        with:
          merge_deploy_mode: "true"
          environment: github-pages

      - name: read Pages configuration
        if: ${{ steps.deployment-check.outputs.continue == 'true' }}
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # pin@v6.0.0
        with:
          enablement: false

  build:
    if: ${{ needs.deployment-check.outputs.continue == 'true' }}
    needs: deployment-check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: validate selected revisions
        env:
          TRUSTED_SHA: ${{ github.sha }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: checkout trusted tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # pin@v6
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: checkout selected content
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # pin@v6
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: build with verified Hugo
        id: site
        env:
          TRUSTED_SHA: ${{ github.sha }}
          SELECTED_SHA: ${{ github.sha }}
          BASE_URL: ${{ needs.deployment-check.outputs.base_url }}
        run: python3 trusted/script/ci/build_site.py

      - name: upload artifact
        id: artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # pin@v5
        with:
          name: site-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ steps.site.outputs.path }}

  deploy:
    if: ${{ needs.deployment-check.outputs.continue == 'true' }}
    needs: [ deployment-check, build ]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # pin@v5
        with:
          artifact_name: site-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
